steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/vertex-quant-backend:${COMMIT_SHA}',
      '-t', '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/vertex-quant-backend:latest',
      '.'
    ]

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      '--all-tags',
      '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/vertex-quant-backend'
    ]

  # Step 3: Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args: [
      'run', 'deploy', '${_SERVICE_NAME}',
      '--image', '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/vertex-quant-backend:${COMMIT_SHA}',
      '--region', '${_DEPLOY_REGION}',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

images:
  - '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/vertex-quant-backend:${COMMIT_SHA}'
  - '${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/vertex-quant-backend:latest'

substitutions:
  _AR_REGION: 'europe-west1'
  _AR_REPO: 'vertex-quant-registry'
  _DEPLOY_REGION: 'europe-west1'
  _SERVICE_NAME: 'vertex-quant-backend'

options:
  logging: CLOUD_LOGGING_ONLY
